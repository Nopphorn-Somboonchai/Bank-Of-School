<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gRoof" x1="40" y1="24" x2="220" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2D46"/>
      <stop offset="0.55" stop-color="#274767"/>
      <stop offset="1" stop-color="#22E2C3"/>
    </linearGradient>
    <linearGradient id="gFrame" x1="28" y1="52" x2="224" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CE8DA"/>
      <stop offset="1" stop-color="#17B6FF"/>
    </linearGradient>
    <linearGradient id="gStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4F1FF"/>
      <stop offset="0.45" stop-color="#8DB5D5"/>
      <stop offset="1" stop-color="#4D708E"/>
    </linearGradient>
    <linearGradient id="gBase" x1="24" y1="196" x2="232" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22324D"/>
      <stop offset="0.6" stop-color="#284765"/>
      <stop offset="1" stop-color="#20384F"/>
    </linearGradient>
    <linearGradient id="gNeon" x1="74" y1="120" x2="180" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#40F1CF"/>
      <stop offset="1" stop-color="#11C2FF"/>
    </linearGradient>
    <linearGradient id="gShieldInner" x1="95" y1="118" x2="160" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#223D58"/>
      <stop offset="1" stop-color="#122132"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 110) rotate(90) scale(100 90)">
      <stop offset="0" stop-color="#43F1D0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#43F1D0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0B1520" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <ellipse cx="128" cy="168" rx="88" ry="60" fill="url(#gGlow)"/>

    <!-- Roof -->
    <path d="M22 73L128 22L234 73C236.5 74.2 236.5 77.8 234.2 79L226.5 83H29.5L21.8 79C19.5 77.8 19.5 74.2 22 73Z" fill="url(#gRoof)"/>
    <path d="M41 73L128 33L215 73" stroke="url(#gFrame)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <rect x="28" y="82" width="200" height="16" rx="8" fill="url(#gRoof)"/>
    <rect x="28" y="82" width="200" height="2" rx="1" fill="url(#gFrame)" opacity="0.9"/>

    <!-- Medallion -->
    <g filter="url(#softGlow)">
      <circle cx="128" cy="64" r="18" fill="url(#gShieldInner)" stroke="url(#gNeon)" stroke-width="2.5"/>
      <path d="M118 61L128 54L138 61" stroke="url(#gNeon)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M118 69H138" stroke="url(#gNeon)" stroke-width="3" stroke-linecap="round"/>
      <rect x="120.5" y="61.5" width="4" height="7" rx="1.5" fill="url(#gNeon)"/>
      <rect x="126" y="61.5" width="4" height="7" rx="1.5" fill="url(#gNeon)"/>
      <rect x="131.5" y="61.5" width="4" height="7" rx="1.5" fill="url(#gNeon)"/>
    </g>

    <!-- Inner dark background -->
    <rect x="49" y="96" width="158" height="82" rx="8" fill="#142638" opacity="0.95"/>

    <!-- Columns -->
    <g>
      <g>
        <rect x="42" y="103" width="35" height="89" rx="14" fill="url(#gStone)"/>
        <rect x="36" y="95" width="47" height="14" rx="7" fill="url(#gStone)"/>
        <rect x="36" y="183" width="47" height="14" rx="7" fill="url(#gStone)"/>
        <rect x="39" y="104" width="41" height="3" rx="1.5" fill="url(#gNeon)" opacity="0.7"/>
      </g>
      <g>
        <rect x="111" y="103" width="35" height="89" rx="14" fill="url(#gStone)"/>
        <rect x="105" y="95" width="47" height="14" rx="7" fill="url(#gStone)"/>
        <rect x="105" y="183" width="47" height="14" rx="7" fill="url(#gStone)"/>
        <rect x="108" y="104" width="41" height="3" rx="1.5" fill="url(#gNeon)" opacity="0.7"/>
      </g>
      <g>
        <rect x="180" y="103" width="35" height="89" rx="14" fill="url(#gStone)"/>
        <rect x="174" y="95" width="47" height="14" rx="7" fill="url(#gStone)"/>
        <rect x="174" y="183" width="47" height="14" rx="7" fill="url(#gStone)"/>
        <rect x="177" y="104" width="41" height="3" rx="1.5" fill="url(#gNeon)" opacity="0.7"/>
      </g>
    </g>

    <!-- Base -->
    <rect x="24" y="197" width="208" height="22" rx="11" fill="url(#gBase)"/>
    <rect x="24" y="197" width="208" height="2.5" rx="1.25" fill="url(#gNeon)" opacity="0.9"/>
    <rect x="13" y="216" width="230" height="24" rx="12" fill="url(#gBase)"/>
    <rect x="13" y="216" width="230" height="2.5" rx="1.25" fill="url(#gNeon)" opacity="0.9"/>

    <!-- Shield -->
    <g filter="url(#softGlow)">
      <path d="M128 113C150 125 168 126 168 126V163C168 188 151 205 128 214C105 205 88 188 88 163V126C88 126 106 125 128 113Z" fill="url(#gShieldInner)" stroke="url(#gNeon)" stroke-width="4"/>
      
      <!-- Chip core -->
      <rect x="114" y="148" width="28" height="28" rx="7" fill="url(#gNeon)"/>
      
      <!-- Circuit lines -->
      <g stroke="url(#gNeon)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M128 148V130"/>
        <path d="M128 176V194"/>
        <path d="M114 162H95"/>
        <path d="M142 162H161"/>
        <path d="M118 152L104 138"/>
        <path d="M138 152L152 138"/>
        <path d="M118 172L104 186"/>
        <path d="M138 172L152 186"/>
      </g>
      
      <!-- Nodes -->
      <g fill="url(#gNeon)">
        <circle cx="128" cy="126" r="5"/>
        <circle cx="128" cy="198" r="5"/>
        <circle cx="92" cy="162" r="5"/>
        <circle cx="164" cy="162" r="5"/>
        <circle cx="100" cy="134" r="5"/>
        <circle cx="156" cy="134" r="5"/>
        <circle cx="100" cy="190" r="5"/>
        <circle cx="156" cy="190" r="5"/>
      </g>
    </g>
  </g>
</svg>
